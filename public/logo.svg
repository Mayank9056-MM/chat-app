<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .brand-text {
        fill: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .ai-box {
        fill: rgba(6, 182, 212, 0.12);
        stroke: #06B6D4;
        stroke-width: 1;
      }
      .ai-text {
        fill: #38BDF8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      @media (prefers-color-scheme: light) {
        .brand-text { fill: #0F172A; }
        .ai-box { fill: rgba(79, 70, 229, 0.08); stroke: #6366F1; }
        .ai-text { fill: #4F46E5; }
      }
    </style>
    <linearGradient id="logo-grad-flow" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neural Mark (Group scaled & positioned) -->
  <g transform="translate(4, 8) scale(0.48)">
    <!-- Main N Conduits -->
    <path d="M22 84 V16" stroke="url(#logo-grad-flow)" stroke-width="11" stroke-linecap="round"/>
    <path d="M22 16 L84 84" stroke="url(#logo-grad-flow)" stroke-width="11" stroke-linecap="round"/>
    <path d="M84 84 V16" stroke="url(#logo-grad-flow)" stroke-width="11" stroke-linecap="round"/>

    <!-- Light Cores -->
    <path d="M22 74 V26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M30 24 L76 76" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M84 74 V26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Synaptic Nodes -->
    <circle cx="22" cy="16" r="8.5" fill="#8B5CF6" filter="url(#logo-glow)"/>
    <circle cx="22" cy="16" r="4" fill="#FFFFFF"/>

    <circle cx="22" cy="84" r="8.5" fill="#7C3AED" filter="url(#logo-glow)"/>
    <circle cx="22" cy="84" r="4" fill="#FFFFFF"/>

    <circle cx="84" cy="16" r="8.5" fill="#0EA5E9" filter="url(#logo-glow)"/>
    <circle cx="84" cy="16" r="4" fill="#FFFFFF"/>

    <circle cx="84" cy="84" r="8.5" fill="#10B981" filter="url(#logo-glow)"/>
    <circle cx="84" cy="84" r="4" fill="#FFFFFF"/>

    <!-- Central Soma -->
    <circle cx="53" cy="50" r="13" fill="#09090B" stroke="url(#logo-grad-flow)" stroke-width="3"/>
    <circle cx="53" cy="50" r="6" fill="#38BDF8" filter="url(#logo-glow)"/>
    <circle cx="53" cy="50" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography "Neuron" -->
  <text x="68" y="42" font-size="30" class="brand-text">Neuron</text>

  <!-- Micro "AI" Badge -->
  <rect x="188" y="23" width="28" height="18" rx="5" class="ai-box"/>
  <text x="194" y="36" font-size="10" class="ai-text">AI</text>
</svg>